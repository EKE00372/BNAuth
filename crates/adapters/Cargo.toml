[package]
name = "bnauth-adapters"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
bnauth-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
zeroize = "1.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security"] }
